name: Package deck

# What this does
# ---------------
# * On every push to main / PR touching the deck: validate that the slide
#   manifest matches the rendered PNGs. No artifact is produced -- this is just
#   a tripwire for a broken commit.
# * On a version tag (v*) or manual run: build prague-deck-<tag>.zip from the
#   already-committed deck and attach it to a GitHub Release. The committed PNGs
#   ARE the deliverable, so CI packages them rather than re-rendering from the
#   Google Slides PDF (which needs heavy deps and could drift from the
#   hand-tuned slides).
#
# Release assets live with the repo's releases (permanent until deleted), not in
# Git history, so they do not grow the clone. Cut a release with:
#   git tag -s v2026.10.01-dryrun -m "Prague dry-run deck"
#   git push origin v2026.10.01-dryrun

on:
  push:
    branches: [main]
    paths:
      - 'prague-deck/**'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'prague-deck/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create the zip under (e.g. v2026.10.06)'
        required: true

permissions:
  contents: write   # needed to create a Release and upload the asset

concurrency:
  group: package-deck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the slide manifest matches the rendered PNGs
        run: |
          python3 - <<'PY'
          import json, os, sys
          root = "prague-deck"
          problems = []
          for manifest in ("slides.json", "slides-lite/slides.json"):
              entries = json.load(open(os.path.join(root, manifest)))
              for rel in entries:
                  if not os.path.isfile(os.path.join(root, rel)):
                      problems.append(f"{manifest}: lists missing file {rel}")
          if not os.path.isfile(os.path.join(root, "index.html")):
              problems.append("index.html is missing")
          if problems:
              print("Deck manifest check FAILED:")
              for p in problems:
                  print("  -", p)
              sys.exit(1)
          print("Deck manifest OK: every listed slide and index.html are present.")
          PY

  release:
    # Only on a pushed tag or a manual dispatch -- never on a plain branch push/PR.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="prague-deck-${tag}"
          mkdir -p dist
          # Archive extracts to a self-contained prague-deck/ -- open its
          # index.html from disk after unzip (no server needed).
          zip -r -q "dist/${name}.zip" prague-deck -x 'prague-deck/*.zip'
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "ZIP=dist/${name}.zip" >> "$GITHUB_ENV"
          ls -lh "dist/${name}.zip"

      - name: Create or update the Release and attach the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A manual dispatch supplies a tag that may not exist yet; create it at
          # the checked-out commit so the release has something to point at.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Prague deck $TAG" \
              --notes "Self-contained web deck. Download the zip, unzip, open prague-deck/index.html from disk (press F, then Space)." \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$ZIP" --clobber
