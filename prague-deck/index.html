<!-- try-valkey: the Valkey sign-on -> a REAL valkey-server (compiled to WebAssembly) running in this tab.
     v3: the mock loader and mock CLI of the v2 prototype are replaced by the actual module. The download that
     drives the tape loader is valkey-server.wasm; the boot readout's milestones are real events (FETCH = bytes
     landed, COMPILE = WebAssembly instantiated, SERVER = "Server initialized" in the server log, VALKEY READY =
     "Ready to accept connections"); the terminal is a real client on an in-process connection, with
     valkey-cli's own line splitting (sdssplitargs, in the module) and a port of its TTY formatter.
     ?mock=1 keeps the v2 stand-ins (also the automatic fallback if the .wasm cannot be fetched).
     ?dl=SECONDS / ?boot=SECONDS now mean MINIMUM durations (the fetch is paced, the boot delayed) so the vamps
     can be demonstrated on a fast connection; 0/0 = as fast as the machine allows.

     Original brief (v2) follows.
     BRIEF: Valkey sign-on -> TRY-VALKEY handoff prototype (v2, three-phase). Derived from valkey-signon.html.
     PRINCIPLE: vamp on the parts whose length is unknown, play fixed material on the parts that are known.

     PHASE 1  LOAD (download, open-ended). The tape loader: black frame, `> LOADING EMULATOR ... 42%` from the
              first frame, and horizontal stripes racing around the frame's border the way a ZX Spectrum's did
              while a tape loaded -- their scroll is driven by bytes received, so a stall visibly freezes them
              (and the line says "(stalled)"). Audio: vamp A, one bar at a time, thickening a layer per download
              quartile. Download complete = the cue; the sign-on starts on the next bar boundary.
     PHASE 2  SIGN-ON (boot begins). The fixed PRE clock: power-on flare, then a boot readout of REAL milestones
              (KERNEL / ROOTFS / NETWORK / VALKEY). Each label types on its beat; its status word pops when the
              matching serial marker arrives (MARKERS[]), or on the beat if it already has. Wireframe draw,
              connections land, tension.
     PHASE 3  HOLD (until the server is ready, elastic). The dominant pedal: ports breathe once per bar, no
              streams yet, the kernel tail scrolls dim under the readout. Audio: vamp B on B7 -- the harmony
              before the unlock was already dominant, so it loops until the cue. Cue = `Ready to accept
              connections`. The unlock is quantized to the next bar (iMUSE-style), decided LOOKAHEAD early so
              audio can be booked; minimum hold keeps the fast path identical to the fixed sign-on (unlock 3.18).
     UNLOCK   The POST clock (elements with class .post, delays re-based to the unlock): flood, wordmark, tagline,
              stragglers, flicker; handoff at +3.12 to the static header + mock terminal (as v1).

     MOCK LOADER: ?dl=SECONDS download (jitter + stalls), ?boot=SECONDS boot (canned Linux lines, kernel-like
     clumping, carrying the four MARKERS). Presets: FAST 1/1, TYPICAL 4/3, SLOW 20/6. Real integration swaps this
     for v86: progress from its loader, lines from serial0, the same MARKERS as the contract with the image.
     SKIP INTRO / Esc: jump to the hold (never unlocks before the server is ready), then straight to the terminal.
     Sound is OPT-IN (default off). Audio beds run long (T.end=90) and fade at the handoff.

     MOCK CLI: PING ECHO SET(EX/PX/NX/XX) GET DEL EXISTS INCR INCRBY DECR KEYS TTL PTTL EXPIRE TYPE DBSIZE
     FLUSHALL HSET HGET HGETALL HLEN LPUSH RPUSH LRANGE LLEN SADD SMEMBERS SCARD INFO CLEAR HELP, valkey-cli
     formatting, history. A stand-in for judging the flow (and a plausible fallback), not a Valkey.

     Everything below this block is the original sign-on brief; its fixed timings now describe the PRE clock,
     with post-unlock times expressed as offsets from the unlock in T.P. -->
<!-- BRIEF: Valkey 80s "sign-on" animation, v2. A ~6.5s boot sequence in the tradition of a CRT
     terminal powering on: cool blue vector graphics (Tron / Battlezone / a Commodore booting),
     deliberately NOT the Conductress vaporwave poster. One hue only: Valkey blue #6983ff.

     CONCEPT: the unlock. The Valkey mark is a keyhole inside a hexagon, so the machine powers on,
     draws its own emblem as wireframe, turns the key, and unlocks into solid colour. It ends on the
     tagline with a cursor that blinks forever. (v1 had a READY. prompt after the tagline; cut in v2
     -- it didn't land.)

     TIMELINE (seconds)
       0.00  CRT power-on: a white line flares across the centre and expands into the picture
       0.50  boot lines scroll like a BIOS POST, one per beat (0.5 / 0.8 / 1.1 / 1.4), dot leaders,
             status word snaps on 0.24s after each label
       1.75  wireframe draw: the official mark path traced as a glowing vector stroke (0.9s), then
             the keyhole circle last (2.65-2.80)
       2.85  key turn: the whole wireframe rotates 16deg with a click, holds, snaps back at 3.18.
             The boot log vanishes as the key starts to turn.
       3.18  UNLOCK: solid blue floods outward from the keyhole, white flare, shock ring, glow.
       3.70  VALKEY revealed by a vertical scan beam sweeping left to right (0.6s)
       4.50  OPEN SOURCE, FOREVER types in with a block cursor (20 chars, 0.8s); cursor blinks on
       5.90  one scanline flicker. Hold. REPLAY.

     HARMONY (v2): everything before the unlock sits on the DOMINANT so the E major hit at 3.18 is a
     resolution, not a repeat. Boot status notes climb F# A C# D# (5, b7, 9, 3 of B9, ending on the
     leading tone); the wireframe arpeggio outlines B13; the keyhole bell is D#; TURBINE's stacked
     swells are a B7 voicing held to ignition; LAUNCH's sequencer arpeggiates B7 and its string swell
     is the D#/A tritone; SID's key turn is a ii-V bass walk (F#2, B2) into E.

     MODES (v3): KEY TURN (above) or CONNECT. In CONNECT the key turn is replaced by clients:
       2.40       all 28 horizontal lines leave both edges TOGETHER and land within ~0.16s (per-line
                  0.20-0.36s ease-out), stopping at a padding hexagon with the mark's own proportions.
                  Nobody draws that hexagon; the line endpoints trace it. Each landing twinkles.
       3.18       the flood fills the mark and every connected line erupts with a stream of glowing
                  dots flowing OUTWARD (the server serving). Emission ramps 5 -> 30 dots/s over 1.4s;
                  dots leave slow and accelerate (v0 55px/s, 950px/s^2), stretching into dashes as
                  they speed up (motion blur) and fading at the frame edge. Five straggler flourishes
                  during the hold are re-twinkles on EXISTING ports (no new connections), timed as a
                  musical phrase (G# B C# D# . E). Streams run forever. Inward motion is ONLY the
                  connection landing. Defaults: CONNECT + LAUNCH.
       Rendering: a transparent <canvas> over the SVG, mix-blend-mode:screen, one pre-rendered glow
       sprite stamped additively (no shadowBlur). Every dot is closed-form in time (no simulation
       state), so ?t= seek is exact and REPLAY is identical. Tuning knobs: HEX, ARRIVE, RAMP, V0, ACC.
       Audio: the skeleton's key event becomes one dominant-tone ping per connection, plus a quiet
       data-hiss bed after the unlock.

     AUDIO: synthesised live in WebAudio, four scores + silent, all in E major, all locked to the
     timeline above. Any score can be run through the VHS TAPE chain (lowpass, high-shelf dip, soft
     saturation, wow+flutter via a modulated delay line, pink hiss bed).
       FM SYNTH   DX7 / Sega-startup world: bell per boot line over a low B pad, six-note ascending
                  arpeggio on the wireframe draw, ratchet + thunk on the key, FM-brass chord on unlock.
       SID CHIP   Commodore 64: PWM pulse leads, 50Hz chord arpeggios, ring-mod bell, noise drum.
       TURBINE    Vangelis. A TUNED jet-engine drone (saws + resonant noise) glides up from E2 to
                  B3 over the spool; an amplitude flutter starts as an 7Hz blade-pass chop and
                  accelerates into a 60Hz whine. CS-80 brass swells stack one per boot line.
                  Unlock = sub hit + huge brass chord + shimmer; engine drops to idle under the hold.
       LAUNCH     Rocket countdown. A 16th-note sequencer accelerates over the spool riding a
                  Shepard glissando (six octave-spaced voices, each sweeping one octave, windowed so
                  the rise never arrives); brown-noise rumble grows; boot lines are the count.
                  Ignition = white-noise blast swept down + bass drop + a rising-fifth brass motif.
     Browsers refuse audio without a gesture, so the sequence starts on a click: PRESS START.

     DEBUG: ?t=2.5 pauses every animation at t=2.5s (Web Animations API) for frame capture; add
            &mode=connect to render the canvas streams at that instant too.
            ?run=turbine[&tape=1] starts the sequence + schedules that score without a gesture
            (audio stays suspended, but any scheduling exception surfaces in the console).
     Valkey and the Valkey logo are trademarks of LF Projects, LLC. Mark path from valkey.io. -->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VALKEY — sign-on</title>
<style>
  :root { --bg:#070a1a; --blue:#6983ff; --ice:#9fb0ff; --white:#eaf0ff; --dim:#3a4a8a; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000}
  #frame{position:relative;width:min(100vw,180vh);flex:none;transition:width 1.4s cubic-bezier(.4,0,.2,1)}
  .hand #stage{justify-content:flex-start}
  .hand #frame{width:min(var(--colw, 52vw), 80vh)}   /* never taller than ~44vh (900:500), so the terminal keeps its room */
  @media (max-width: 1150px){ .hand #termbar{top:14px;bottom:auto} }   /* thin margins: the replay button moves off the column, to the top-right */
  #bgcover{transition:opacity 1.4s cubic-bezier(.4,0,.2,1)} .hand #bgcover{opacity:1}   /* the picture's navy gradient goes to the page's black as it shrinks */
  /* silent fast path: no picture, no shrink transition, terminal appears at once (no fades) */
  .nofx #frame{transition:none}
  .nofx.termon #term{opacity:1;transition:none}
  .fast #streams{display:none} .fast #bgcover{opacity:1;transition:none}
  /* fast path: the sign appears already lit -- every intro animation is longhand with fill-mode:both, so zeroing
     durations+delays lands each element on its exact end state without playing a frame. (.hand already kills the
     one infinite animation, the tagline cursor.) */
  .instant .anim{animation-duration:0s !important;animation-delay:0s !important}
  /* SHUTDOWN easter egg: the neon sign dies. ONE hard blink (on-off-on, ~1.5 opposing pairs, well under the
     3-flashes/sec WCAG 2.3.1 line), then the tube is dead: fills gone, a dim unfilled outline of the mark and
     wordmark left behind. The tagline stays lit -- open source, forever. Only the logo blinks, never the page.
     Sparks burst from a few vertices of the hexagon like a shorting tube (tiny points, zero strobe risk). */
  @keyframes neonblink{
    0%{opacity:1} 42%{opacity:.06}                          /* the tube cuts out */
    62%{opacity:.85} 100%{opacity:1}                        /* catches once more -- by now the ghost styles are in */
  }
  .lightsout #art{animation:neonblink .6s steps(1,end) forwards}
  .lightsout #streams{opacity:0;transition:opacity .4s}
  /* the dead sign: no fill anywhere, just a faint trace of where the light used to be (!important so any
     leftover forwards-fill intro animation cannot win the cascade over these) */
  .dead #flood{opacity:0 !important}
  .dead #wire{opacity:1 !important;stroke:#44548f !important;filter:none !important;animation:none !important}
  .dead #word text{opacity:0 !important}
  .dead #word text:last-of-type{opacity:1 !important;fill:none !important;stroke:#44548f;stroke-width:1.3;filter:none}
  #sparks{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
  #sparks i{position:absolute;width:var(--sz,3px);height:var(--sz,3px);border-radius:50%;background:#ffffff;
    box-shadow:0 0 8px 2px rgba(190,205,255,1),0 0 20px 6px rgba(130,160,255,.6);opacity:0;
    animation:sparkburst var(--dur,.9s) cubic-bezier(.15,.6,.45,1) var(--dly,0s) forwards}
  @keyframes sparkburst{
    0%{opacity:1;transform:translate(0,0)}
    30%{opacity:1;transform:translate(var(--mx,0px),var(--my,0px))}
    75%{opacity:.9}
    100%{opacity:0;transform:translate(var(--dx,0px),var(--dy,80px))}
  }
  @media (prefers-reduced-motion: reduce){
    .lightsout #art{animation:none}                         /* no blink: straight to the dead sign */
    #sparks i{animation:none;opacity:0}
  }
  svg#art{width:100%;height:auto;display:block}
  /* CONNECT mode: the client streams live on a canvas over the SVG, screen-blended so the additive glow reads as light */
  #streams{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
  .hand #tcur{animation-name:none !important;opacity:0 !important}

  /* vamp corner: LOAD phase shows the download line at the top; the boot HOLD shows the kernel tail under the milestone readout */
  #vamp{position:absolute;left:7.1%;top:7%;width:70%;font-size:min(1.45vw,2.6vh);line-height:1.55;letter-spacing:.06em;color:#6983ff;opacity:0;transition:opacity .4s;white-space:pre;text-shadow:0 0 6px rgba(105,131,255,.55);pointer-events:none}
  #vamp.hold{top:29%} #vamp.on{opacity:1} #vamp .dim{opacity:.55} #vamp b{color:#eaf0ff;font-weight:normal}

  /* the terminal */
  #term{display:none;flex:1;width:var(--colw, min(52vw,80vh));min-height:0;box-sizing:border-box;padding:1.2vh 0 2vh;color:#9fb0ff;font-size:var(--tfs);line-height:1.45;opacity:0;transition:opacity .8s;position:relative;overflow:hidden}
  /* Type does not scale with window width. The column is up to 80 characters; narrowing the window eats the
     margins first (--gutter each side), then the column drops below 80 columns (lines wrap, as a terminal
     would) -- the glyphs never shrink. Height still sets the size so the picture + terminal fit vertically. */
  :root{--tfs:clamp(13px, 2.1vh, 22px); --gutter:16px}
  .hand #term{display:flex;flex-direction:column} .hand.termon #term{opacity:1}
  #tout{flex:0 1 auto;min-height:0;overflow-y:auto;white-space:pre-wrap;word-break:break-all;scrollbar-width:thin;scrollbar-color:#1a2244 transparent}
  #tout::-webkit-scrollbar{width:6px} #tout::-webkit-scrollbar-thumb{background:#1a2244}
  #tline{white-space:pre-wrap;word-break:break-all}
  .p{color:#6983ff} .o{color:#eaf0ff} .e{color:#ff6b8a} .d{color:#3a4a8a}
  #tcur2{display:inline-block;width:.6em;height:1.1em;background:#9fb0ff;vertical-align:-.15em;animation-name:blink;animation-duration:1.06s;animation-timing-function:steps(1,end);animation-iteration-count:infinite}
  #tin{position:absolute;opacity:0;left:0;top:0;width:1px;height:1px;border:0;padding:0;font-size:16px}  /* >=16px: iOS does not zoom the page on focus */
  #termscan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
  #termbar{position:fixed;right:18px;bottom:14px;font-size:11px;letter-spacing:.25em;color:#3a4a8a;display:none;gap:14px}
  .hand #termbar{display:flex} #termbar button{background:rgba(105,131,255,.12);border:1px solid #6983ff;color:#9fb0ff;font:inherit;letter-spacing:inherit;padding:8px 14px;cursor:pointer;text-shadow:0 0 8px rgba(105,131,255,.45);box-shadow:0 0 12px rgba(105,131,255,.25);transition:background .2s,color .2s,box-shadow .2s}
  #termbar button:hover{background:#6983ff;color:#000;text-shadow:none;box-shadow:0 0 18px rgba(105,131,255,.5)}
  #skip{position:fixed;left:18px;bottom:14px;font-size:11px;letter-spacing:.25em;color:#3a4a8a;background:none;border:1px solid #1a2244;padding:6px 12px;cursor:pointer;opacity:0;transition:opacity .4s}
  .started #skip{opacity:1;transition-delay:.6s} .hand #skip{display:none}

  .titleface{font-family:'Open Sans Deck','Open Sans',Arial,sans-serif;font-weight:600}
  .mono{font-family:'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}

  /* everything parks in its "before" state; .play starts the PRE-UNLOCK clocks. Elements with .post belong to the
     POST-UNLOCK clock: their delays are re-based to the unlock instant and .unlock starts them, so the tension hold
     between the two clocks can be any length (it vamps until the emulated server is actually ready).
     NOTE: never use the `animation:` shorthand below -- it resets fill-mode/play-state and overrides these classes.
     Longhands only. */
  .anim{animation-play-state:paused;animation-fill-mode:both}
  .play .anim{animation-play-state:running}
  .play .anim.post{animation-play-state:paused}
  .unlock .anim.post{animation-play-state:running}

  /* 0.00 power on */
  #bg   {animation-name:fadein;animation-duration:.5s;animation-timing-function:ease-out;animation-delay:.12s}
  #tube {transform-origin:450px 250px;animation-name:tube;animation-duration:.6s;animation-timing-function:cubic-bezier(.2,.8,.3,1);animation-delay:0s}

  /* 0.50 boot milestones: label types on its beat; the status word is set by JS when the REAL boot marker arrives
     (or on the beat if it already has). The readout stays up through the hold and vanishes at the unlock. */
  #boot{animation-name:fadeout;animation-duration:.25s;animation-timing-function:ease-out;animation-delay:0s}
  .bl{animation-name:typein;animation-duration:.2s;animation-timing-function:steps(24,end)}
  .st{fill-opacity:0} .st.on{fill-opacity:1}
  .bl:nth-of-type(1){animation-delay:.50s} .bl:nth-of-type(2){animation-delay:.80s}
  .bl:nth-of-type(3){animation-delay:1.10s} .bl:nth-of-type(4){animation-delay:1.40s}

  /* 1.75 wireframe draw (stroke length set from JS into --L), fades out once the fill lands */
  #wmain{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation-name:draw;animation-duration:.9s;animation-timing-function:cubic-bezier(.35,.2,.45,1);animation-delay:1.75s}
  #wcirc{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation-name:draw;animation-duration:.15s;animation-timing-function:ease-out;animation-delay:2.65s}
  #wire {animation-name:fadeout;animation-duration:.45s;animation-timing-function:ease-out;animation-delay:0s}

  /* 2.85 key turn (KEY TURN mode): rotate and HOLD on the pre clock; snap back on the post clock */
  #key  {transform-origin:450px 225px;animation-name:keyhold;animation-duration:.125s;animation-timing-function:linear;animation-delay:2.85s}
  .unlock #key{animation-name:keysnap;animation-duration:.1s;animation-delay:0s}
  .connect #key,.connect.unlock #key{animation-name:none}

  /* UNLOCK (post clock, t=0 is the unlock instant) */
  #flood{animation-name:flood;animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-delay:0s}
  #flare {transform-origin:450px 225px;animation-name:flare;animation-duration:.9s;animation-timing-function:ease-out;animation-delay:0s}
  #shock {transform-origin:450px 225px;animation-name:shock;animation-duration:.9s;animation-timing-function:cubic-bezier(.1,.8,.2,1);animation-delay:0s}
  #glow  {transform-origin:450px 225px;animation-name:glowup;animation-duration:.9s;animation-timing-function:cubic-bezier(.2,.9,.2,1);animation-delay:0s}

  /* +0.52 wordmark scan-beam reveal */
  #word {animation-name:typein;animation-duration:.6s;animation-timing-function:linear;animation-delay:.52s}
  #beam {animation-name:beam;animation-duration:.6s;animation-timing-function:linear;animation-delay:.52s}

  /* +1.32 tagline types; its cursor then blinks forever. +2.72 scanline flicker */
  #tag  {animation-name:typein;animation-duration:.8s;animation-timing-function:steps(20,end);animation-delay:1.32s}
  #tcur {animation-fill-mode:none !important;animation-name:blink;animation-duration:1.06s;animation-timing-function:steps(1,end);animation-delay:1.32s;animation-iteration-count:infinite}
  #scan {animation-name:flicker;animation-duration:.35s;animation-timing-function:steps(2,end);animation-delay:2.72s}
  #vignette{animation-name:fadein;animation-duration:1.2s;animation-timing-function:ease-out;animation-delay:0s}

  .tw{animation-name:wordon;animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  @keyframes wordon{0%{opacity:0;fill:#ffffff}12%{opacity:1;fill:#ffffff}100%{opacity:1;fill:#eaf0ff}}
  #ui,#skip,#termbar,#replay{display:none !important}
  .started{cursor:none}
  #stage.off{animation:crtoff .23s cubic-bezier(.33,1,.68,1) forwards}
  @keyframes crtoff{from{transform:scaleY(1);filter:brightness(1)}to{transform:scaleY(.004);filter:brightness(3.5)}}
  #bline{position:fixed;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:#fff;opacity:0;pointer-events:none}
  #bwhite{position:fixed;inset:0;background:#fff;transform:scaleY(0);pointer-events:none}
  #bwhite.open{animation:bopen .37s cubic-bezier(.33,1,.68,1) forwards}
  @keyframes bopen{from{transform:scaleY(.005)}to{transform:scaleY(1)}}
  #deck{position:fixed;inset:0;background:#fff;display:none;align-items:center;justify-content:center}
  body.deck #deck{display:flex} body.deck #stage,body.deck #bline{display:none}
  #deck img{width:100vw;height:100vh;object-fit:contain;display:none}
  #deck img.cur{display:block}
  #blackout{position:fixed;inset:0;background:#000;display:none;z-index:9} body.black #blackout{display:block}
  #clock{position:fixed;right:22px;bottom:16px;font:600 22px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#555;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:6px;display:none;z-index:8}
  #clock.show{display:block} #clock.late{color:#b42318} #clock.amber{color:#9a6700}
  #preload{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font:400 15px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#9aa;display:none;z-index:9}
  #preload.show{display:block}
  #hint{position:fixed;right:18px;bottom:14px;font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.25em;color:#1a2244;transition:opacity .6s}
  .started #hint{opacity:0}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes fadeout{from{opacity:1}to{opacity:0}}
  @keyframes tube{0%{transform:scale(0,.004);opacity:1}
                  30%{transform:scale(1,.004);opacity:1}
                  70%{transform:scale(1,1);opacity:.85}
                  100%{transform:scale(1,1);opacity:0}}
  @keyframes typein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes keyhold{from{transform:rotate(0deg)}to{transform:rotate(16deg)}}
  @keyframes keysnap{0%{transform:rotate(16deg)}60%{transform:rotate(-2.5deg)}100%{transform:rotate(0deg)}}
  @keyframes flood{from{clip-path:circle(0px at 28.45px 32.45px)}to{clip-path:circle(40px at 28.45px 32.45px)}}
  @keyframes flare{0%{opacity:0;transform:scale(1.3)}15%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1)}}
  @keyframes shock{0%{opacity:0;transform:scale(.3)}3%{opacity:.7}100%{opacity:0;transform:scale(3.2)}}
  @keyframes glowup{from{opacity:0;transform:scale(.3)}to{opacity:.13;transform:scale(1)}}
  @keyframes beam{0%{transform:translateX(0);opacity:0}2%{opacity:1}92%{opacity:1}100%{transform:translateX(var(--bw));opacity:0}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  @keyframes flicker{0%{opacity:.16}50%{opacity:.5}100%{opacity:.2}}

  /* ---------- chrome ---------- */
  #ui{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.74);color:var(--white);
      letter-spacing:.18em;text-align:center;transition:opacity .3s}
  #ui.hidden{opacity:0;pointer-events:none}
  #ui button{background:none;border:2px solid var(--blue);color:var(--blue);font:inherit;letter-spacing:.3em;padding:14px 34px;cursor:pointer;margin:10px}
  #ui button:hover{background:var(--blue);color:var(--bg)}
  #ui .row{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap;max-width:640px}
  #ui .row label{font-size:12px;opacity:.85;cursor:pointer;border:1px solid var(--dim);padding:8px 14px}
  #ui .row input{display:none}
  #ui .row input:checked+span{color:var(--ice)}
  #ui .row label:has(input:checked){border-color:var(--blue)}
  #replay{position:fixed;right:18px;bottom:14px;font-size:11px;letter-spacing:.25em;
      color:var(--dim);background:none;border:1px solid #1a2244;padding:6px 12px;cursor:pointer;opacity:0;transition:opacity .4s}
  .play #replay{opacity:1;transition-delay:6.5s} .hand #replay{display:none}
</style>
</head>
<body>
<div id="stage">
<div id="frame">
<svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Valkey sign-on animation">

    </linearGradient>

    <!-- phosphor: soft blue halo on text -->

    </filter>
    <filter id="hotglow" x="-40%" y="-40%" width="180%" height="180%">

    </filter>

    </filter>

  <rect width="900" height="500" fill="#000"/>

  <!-- boot milestone readout, top-left, terminal style. Status words are set when the real boot marker arrives. -->

    <text class="bl anim" x="64" y="48">&gt; FETCH ............. <tspan class="st" fill="#eaf0ff">OK</tspan></text>
    <text class="bl anim" x="64" y="70">&gt; COMPILE ........... <tspan class="st" fill="#eaf0ff">OK</tspan></text>
    <text class="bl anim" x="64" y="92">&gt; SERVER ............ <tspan class="st" fill="#eaf0ff">UP</tspan></text>
    <text class="bl anim" x="64" y="114">&gt; VALKEY ............ <tspan class="st" fill="#eaf0ff">READY</tspan></text>
  </g>

  <!-- the mark. #key rotates the whole thing for the key turn; inner transform places the official path -->
  <g id="key" class="anim">
    <g transform="translate(450 225) scale(3.4026) translate(-28.45 -32.45)">
      <!-- solid mark, revealed by a clip-path circle growing from the keyhole (in mark units) -->
      <g id="flood" class="anim post" style="clip-path:circle(0px at 28.45px 32.45px)">
        <path id="solid" fill="#6983ff" fill-rule="evenodd" filter="url(#bloom)"
          d="M15.2,50l-9.4-5.9v-25L28.8,6l22.3,13.1v26.3l-22.7,12.8-7.9-4.9v-12l-4.3-2.7v-13.6l12.4-7.1,12.1,7.1v14.2l-9.6,5.4v-5.7c2.9-1.1,4.9-3.9,4.9-7.3s-3.4-7.8-7.6-7.8-7.6,3.5-7.6,7.8,2.1,6.2,4.9,7.3v10.9l2.7,1.7,16.8-9.5v-19.7l-16.6-9.8-17.1,9.8v18.5l3.6,2.3v6.8ZM28.5,28.1c1.9,0,3.4,1.6,3.4,3.6s-1.5,3.6-3.4,3.6-3.4-1.6-3.4-3.6,1.5-3.6,3.4-3.6Z"/>
      </g>
      <!-- wireframe: the same geometry traced as a vector stroke -->
      <g id="wire" class="anim post" fill="none" stroke="#b9c6ff" stroke-width=".55" stroke-linejoin="round" filter="url(#hotglow)">
        <path id="wmain" class="anim" d="M15.2,50l-9.4-5.9v-25L28.8,6l22.3,13.1v26.3l-22.7,12.8-7.9-4.9v-12l-4.3-2.7v-13.6l12.4-7.1,12.1,7.1v14.2l-9.6,5.4v-5.7c2.9-1.1,4.9-3.9,4.9-7.3s-3.4-7.8-7.6-7.8-7.6,3.5-7.6,7.8,2.1,6.2,4.9,7.3v10.9l2.7,1.7,16.8-9.5v-19.7l-16.6-9.8-17.1,9.8v18.5l3.6,2.3v6.8Z"/>
        <path id="wcirc" class="anim" d="M28.5,28.1c1.9,0,3.4,1.6,3.4,3.6s-1.5,3.6-3.4,3.6-3.4-1.6-3.4-3.6,1.5-3.6,3.4-3.6Z"/>
      </g>
    </g>
  </g>
  <!-- white version of the mark that flares over the unlock and fades -->
  <g id="flare" class="anim post" filter="url(#flareblur)" opacity="0">
    <g transform="translate(450 225) scale(3.4026) translate(-28.45 -32.45)">
      <path fill="#ffffff" fill-rule="evenodd"
        d="M15.2,50l-9.4-5.9v-25L28.8,6l22.3,13.1v26.3l-22.7,12.8-7.9-4.9v-12l-4.3-2.7v-13.6l12.4-7.1,12.1,7.1v14.2l-9.6,5.4v-5.7c2.9-1.1,4.9-3.9,4.9-7.3s-3.4-7.8-7.6-7.8-7.6,3.5-7.6,7.8,2.1,6.2,4.9,7.3v10.9l2.7,1.7,16.8-9.5v-19.7l-16.6-9.8-17.1,9.8v18.5l3.6,2.3v6.8ZM28.5,28.1c1.9,0,3.4,1.6,3.4,3.6s-1.5,3.6-3.4,3.6-3.4-1.6-3.4-3.6,1.5-3.6,3.4-3.6Z"/>
    </g>
  </g>
  <!-- shock ring from the unlock -->
  <circle id="shock" class="anim post" cx="450" cy="225" r="80" fill="none" stroke="#dfe6ff" stroke-width="2" opacity="0"/>

  <!-- wordmark: three copies (blue ghosts either side, white face), revealed by a clip that tracks the beam -->
  <g id="wordwrap" filter="url(#phos)" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800" font-size="72" letter-spacing="6" text-anchor="middle">
    <g id="word" class="anim post">
      <text x="447" y="372" fill="#6983ff" opacity=".85">VALKEY</text>
      <text x="453" y="372" fill="#6983ff" opacity=".85">VALKEY</text>
      <text x="450" y="372" fill="#f4f7ff">VALKEY</text>
    </g>
    <rect id="beam" class="anim post" style="--bw:318px" x="290" y="308" width="8" height="78" fill="url(#beamg)" filter="url(#hotglow)" opacity="0"/>
  </g>

  <!-- talk title (one word per chime) and speaker name (types like the old tagline) -->
  <g id="titlegrp" class="titleface" filter="url(#phos)" fill="#eaf0ff"></g>
  <g id="tagline" class="titleface" filter="url(#phos)">
    <text id="tag" class="anim post" x="450" y="458" text-anchor="middle" font-size="15" letter-spacing="7" fill="#9fb0ff"></text>
    <rect id="tcur" class="anim post" x="616" y="445" width="10" height="16" fill="#9fb0ff" opacity="0"/>
  </g>

  <!-- CRT power-on flare: a white line that expands into the tube -->
  <rect id="tube" class="anim" x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <rect id="scan" class="anim post" width="900" height="500" fill="url(#scanp)" opacity="0.16"/>
  <rect id="vignette" class="anim" width="900" height="500" fill="none" stroke="#000" stroke-width="44" opacity="0.55"/>
</svg>
<canvas id="streams" aria-hidden="true"></canvas>
<div id="vamp" class="mono" aria-live="polite"></div>
</div>
<div id="term" class="mono" role="region" aria-label="Valkey CLI">
  <div id="tout"></div>
  <div id="tline"><span class="p" id="tprompt">try-valkey&gt; </span><span id="tbuf"></span><span id="tcur2"></span></div>
  <input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="command input">

</div>

<div id="bline"></div><div id="bwhite"></div>
<div id="deck" aria-label="slides"></div><div id="blackout"></div>
<div id="hint">PRESS SPACE TO BEGIN</div><div id="clock"></div><div id="preload"></div>
<div id="ui" class="mono">
  <div>
    <div style="font-size:11px;opacity:.7;margin-bottom:14px">VALKEY · TRY IT <span id="engine-tag">(wasm)</span></div>
    <button id="start">START</button>
    <button id="startsound" style="border-color:#3a4a8a;color:#9fb0ff">START WITH SOUND</button>
    <div style="font-size:11px;opacity:.45;margin-top:18px">more options: open the console and type <b>tryvalkey.help()</b></div>
    <!-- The option controls stay in the DOM (the machine reads them) but are hidden. Defaults: silent, real
         timing, FM synth, no tape, CONNECT. They are set from URL params (?sound= ?mode= ?tape=1 ?dl= ?boot=) or
         the console API (tryvalkey.options({...})), see the bottom of the script. -->
    <div id="uiopts" style="display:none">
    <div class="row" style="align-items:center">
      <span style="font-size:11px;opacity:.6">PACING (min)</span>
      <label><input type="radio" name="preset" value="0,0" checked><span>REAL 0s/0s</span></label>
      <label><input type="radio" name="preset" value="4,3"><span>TYPICAL 4s/3s</span></label>
      <label><input type="radio" name="preset" value="20,6"><span>SLOW 20s/6s</span></label>
      <label style="border-color:transparent"><span style="font-size:11px;opacity:.7">DL <input type="number" id="dl" min="0" step="0.5" style="width:3.6em;background:#0b1024;color:#9fb0ff;border:1px solid #3a4a8a;font:inherit"> s · BOOT <input type="number" id="boot" min="0" step="0.5" style="width:3.6em;background:#0b1024;color:#9fb0ff;border:1px solid #3a4a8a;font:inherit"> s</span></label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="sound"><span>SOUND (opt-in)</span></label>
      <label><input type="checkbox" id="tape"><span>VHS TAPE</span></label>
    </div>
    <div class="row">
      <label><input type="radio" name="mode" value="keyturn"><span>KEY TURN</span></label>
      <label><input type="radio" name="mode" value="connect" checked><span>CONNECT</span></label>
    </div>
    <div class="row">
      <label><input type="radio" name="score" value="fm" checked><span>FM SYNTH</span></label>
      <label><input type="radio" name="score" value="sid"><span>SID CHIP</span></label>
      <label><input type="radio" name="score" value="turbine"><span>TURBINE</span></label>
      <label><input type="radio" name="score" value="launch"><span>LAUNCH</span></label>
      <label><input type="radio" name="score" value="mute"><span>SILENT</span></label>
    </div>
    </div><!-- /uiopts -->
  </div>
</div>
<button id="replay" class="mono">REPLAY</button>

<script>
/* ============================ TIMELINE (must match the CSS above) ============================ */
const T = {
  boot: [0.50, 0.80, 1.10, 1.40], status: 0.24,
  draw: 1.75, drawDur: 0.9, circ: 2.65,
  turn: 2.85, click: 2.97,                      // the tension hold begins at click and lasts until the server is ready (min 0.21s)
  holdMin: 3.18,                                // earliest unlock on the pre clock (= the fixed sign-on's unlock beat)
  // post clock: offsets from the unlock instant
  P: {scan: 0.52, scanDur: 0.6, tag: 1.32, tagDur: 0.8, tagN: 20, stragglers: [0.57, 0.87, 1.17, 1.47, 2.07], flicker: 2.72, hand: 3.12},
  end: 90,                                      // beds (engine idle, rumble, hiss) run long so any vamp can be any length; faded at handoff
};
const UNLOCK = {at: Infinity};                // stage time (pre clock) of the unlock; Infinity while holding
const BAR = 0.5;                              // vamp bar length; every phase transition is quantized to a bar boundary (iMUSE-style)
// stroke length for the wireframe draw, read from the geometry itself
for (const id of ['wmain', 'wcirc']) { const p = document.getElementById(id); p.style.setProperty('--L', p.getTotalLength().toFixed(2)); }

/* ============================ CONNECT MODE: the client streams ============================ */
// Everything here is a pure function of time. Connections have seeded arrival times; each dot's
// position, speed, stretch and fade are closed-form in its age. So ?t= seek is exact, REPLAY is
// identical, and there is no simulation state to drift.
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(i) { i = (i ^ 61) ^ (i >>> 16); i = i + (i << 3); i ^= i >>> 4; i = Math.imul(i, 0x27d4eb2d); i ^= i >>> 15; return (i >>> 0) / 4294967296; }

// The padding hexagon the lines stop at: same proportions as the mark's outer hexagon (pointy-top, so
// its left and right sides are vertical). Nobody draws it; the line endpoints trace it.
const HEX = {apex: 108, hw: 92.4, vh: 53.7};
const hexHalfWidth = dy => (dy = Math.abs(dy)) <= HEX.vh ? HEX.hw : HEX.hw * (HEX.apex - dy) / (HEX.apex - HEX.vh);

const LAUNCH_AT = 2.40;                     // every line leaves its edge at this instant...
const ARRIVE = [.20, .36];                  // ...and takes this long to land, so the landings ripple across ~0.16s
const RAMP = {r0: 5, r1: 30, R: 1.4};       // emission rate ramps 5 -> 30 dots/s over the first 1.4s of a stream
const V0 = 55, ACC = 950;                   // px/s and px/s^2 in viewBox units: dots leave slow and get flung
// straggler flourishes during the hold after the wordmark: re-twinkles on EXISTING ports, timed as a phrase on the POST clock
const TALK = (() => {
  const qq = new URLSearchParams(location.search);
  const title = (qq.get('title') || 'No Client Changes Required').trim().split(/\s+/);
  const name = (qq.get('name') || 'Rain Valentine').toUpperCase();
  const N = title.length;
  // chimes: after the wordmark scan (+0.52..+1.12), one per title word on a steady 0.30s beat, then
  // one more for the name, held back a beat (the source phrase's rhythm: . . . . rest E), so the
  // NAME lands on the tonic and pops in whole on that chime (no typing, no tick sounds: tagN = 0)
  const first = 1.40, beat = 0.30;
  const times = title.map((_, i) => first + beat * i);
  const nameAt = first + beat * N + beat, nameDur = 0;
  Object.assign(T.P, {stragglers: [...times, nameAt], tag: nameAt, tagDur: 0, tagN: 0,
                      flicker: nameAt + 1.0, hand: 1e6});
  // layout: one line if it fits, else two balanced lines; shrink only if a line still overflows
  const NS = 'http://www.w3.org/2000/svg', grp = document.getElementById('titlegrp');
  const mk = (s, fs) => { const e = document.createElementNS(NS, 'text'); e.textContent = s; e.setAttribute('font-size', fs); grp.appendChild(e); return e; };
  const widthOf = (words, fs) => { const e = mk(words.join(' '), fs); const w = e.getComputedTextLength(); e.remove(); return w; };
  const MAXW = 760;
  const tag = document.getElementById('tag'), tcur = document.getElementById('tcur');
  let fs, lines, nameY;
  const layout = () => {
  grp.replaceChildren();
  fs = 30; lines = [title];
  if (widthOf(title, fs) > MAXW && N > 1) {
    let best = 1, bestD = Infinity;
    for (let k = 1; k < N; k++) { const d = Math.abs(widthOf(title.slice(0, k), fs) - widthOf(title.slice(k), fs)); if (d < bestD) { bestD = d; best = k; } }
    lines = [title.slice(0, best), title.slice(best)];
  }
  while (Math.max(...lines.map(l => widthOf(l, fs))) > MAXW && fs > 16) fs -= 1;
  const lh = fs * 1.2, y0 = lines.length === 1 ? 416 : 406;
  const spaceW = widthOf(['a', 'a'], fs) - 2 * widthOf(['a'], fs);
  let wi = 0;
  lines.forEach((words, li) => {
    const total = widthOf(words, fs); let x = 450 - total / 2;
    words.forEach(w => {
      const e = mk(w, fs); e.setAttribute('x', x.toFixed(1)); e.setAttribute('y', (y0 + li * lh).toFixed(1));
      e.setAttribute('class', 'anim post tw'); e.style.animationDelay = `${times[wi++]}s`;
      x += e.getComputedTextLength() + spaceW;
    });
  });
  nameY = y0 + (lines.length - 1) * lh + 40;
  tag.textContent = name; tag.setAttribute('y', nameY.toFixed(1));
  };
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  tag.style.animationName = 'wordon'; tag.style.animationDuration = '.55s'; tag.style.animationTimingFunction = 'cubic-bezier(.2,.8,.3,1)';
  tag.style.animationDelay = `${nameAt}s`;
  tcur.remove();                                       // no cursor: the name is not typed
  document.getElementById('scan').style.animationDelay = `${T.P.flicker}s`;
  return {title, name, N, times, nameAt, nameDur, fontSize: fs, lines: lines.length, end: T.P.flicker + 0.35};
})();
// one existing port re-twinkles per chime (each title word + the name; no new connections), spread across both sides
const STRAGGLER_LINES = Array.from({length: TALK.N + 1}, (_, i) => [9, 22, 2, 18, 13, 25, 5, 16, 11, 20][i % 10]);

  const g = ctx.createGain(); g.gain.setValueAtTime(vel, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .35);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + .4);
  noise(t0, .06, {gain: vel * .5, lp: 700, hp: 60, attack: .001, release: .05});
}
function sub(t0, f1, f2, dur, vel = .6) {
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur * .6);
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vel, t0 + .015); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .05);
}
function timpani(t0, midi = 40, vel = .7) {
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(N(midi) * 1.6, t0); o.frequency.exponentialRampToValueAtTime(N(midi), t0 + .06);
  const g = ctx.createGain(); g.gain.setValueAtTime(vel, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + 1.1);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 1.2);
  noise(t0, .09, {gain: vel * .35, lp: 900, hp: 80, attack: .002, release: .07});
}
// the ratchet of the key turning (2.85-2.97), then the thunk as it seats
function keyTurn(t0, vel = .14) { for (let i = 0; i < 5; i++) click(t0 + T.turn + i * .024, vel * (1 + i * .1), 6000, 2000); thunk(t0 + T.click, .45); }
// the scan beam: a rising, hissing sweep (post clock)
function beamSweep(tU, vel = .07) { const n = noise(tU + T.P.scan, T.P.scanDur, {gain: vel, lp: 12000, hp: 300, attack: .05, release: .12}); n.f2.frequency.setValueAtTime(300, tU + T.P.scan); n.f2.frequency.exponentialRampToValueAtTime(7000, tU + T.P.scan + T.P.scanDur); }

/* ---------- sustained voices: attack now, release when told (the hold is of unknown length) ---------- */
function sustain(out, vel, stops, rel = .3) {
  return {release: t => { out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(vel, t); out.gain.linearRampToValueAtTime(0, t + rel); stops.forEach(o => o.stop(t + rel + .05)); }};
}
function swellHold(t0, midi, vel = .12, attack = .5) {
  const out = ctx.createGain(); out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(vel, t0 + attack);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 1.4; f.frequency.setValueAtTime(260, t0); f.frequency.exponentialRampToValueAtTime(1800, t0 + attack * 1.3);
  const vib = ctx.createOscillator(); vib.frequency.value = 5.5; const vg = ctx.createGain(); vg.gain.setValueAtTime(0, t0); vg.gain.linearRampToValueAtTime(9, t0 + attack * 2); vib.connect(vg);
  const oscs = [-8, 0, 8].map(det => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = N(midi); o.detune.value = det; vg.connect(o.detune); const og = ctx.createGain(); og.gain.value = .33; o.connect(og); og.connect(f); o.start(t0); return o; });
  vib.start(t0); f.connect(out); out.connect(master); return sustain(out, vel, [...oscs, vib], .35);
}
function padHold(t0, midi, vel = .09, attack = .6) {
  const out = ctx.createGain(); out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(vel, t0 + attack);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = .8; f.frequency.value = 1800;
  const oscs = [['sine', -6], ['triangle', 0], ['sine', 7]].map(([type, det]) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = N(midi); o.detune.value = det; const og = ctx.createGain(); og.gain.value = .4; o.connect(og); og.connect(f); o.start(t0); return o; });
  f.connect(out); out.connect(master); return sustain(out, vel, oscs, .25);
}
function sidHold(t0, midi, vel = .2, pwm = 6) {
  const a = ctx.createOscillator(); a.setPeriodicWave(pulseWave(.5)); a.frequency.value = N(midi);
  const b = ctx.createOscillator(); b.setPeriodicWave(pulseWave(.12)); b.frequency.value = N(midi);
  const ga = ctx.createGain(), gb = ctx.createGain(); ga.gain.value = .5; gb.gain.value = .5;
  const l = ctx.createOscillator(); l.frequency.value = pwm; const lg = ctx.createGain(); lg.gain.value = .5; const inv = ctx.createGain(); inv.gain.value = -1;
  l.connect(lg); lg.connect(ga.gain); lg.connect(inv); inv.connect(gb.gain);
  const env = ctx.createGain(); env.gain.setValueAtTime(0, t0); env.gain.linearRampToValueAtTime(vel, t0 + .01);
  a.connect(ga); b.connect(gb); ga.connect(env); gb.connect(env); env.connect(master); [a, b, l].forEach(o => o.start(t0));
  return sustain(env, vel, [a, b, l], .06);
}

/* ---------- the engines ---------- */
// TURBINE: tuned drone E2 -> B3 over the spool, blade-pass flutter 7Hz chop -> 60Hz whine, resonant air.
// Holds at the peak whine until release(tc) drops it to idle.
function turbine(t0, {start = .15, peak = T.click, end = T.end} = {}) {
  const out = ctx.createGain(); out.gain.setValueAtTime(0, t0 + start); out.gain.linearRampToValueAtTime(.30, t0 + peak);
  const flut = ctx.createGain(); flut.gain.value = .55;
  const lfo = ctx.createOscillator(); lfo.type = 'sine';
  lfo.frequency.setValueAtTime(7, t0 + start); lfo.frequency.exponentialRampToValueAtTime(60, t0 + peak);
  const depth = ctx.createGain(); depth.gain.setValueAtTime(.45, t0 + start); depth.gain.linearRampToValueAtTime(.15, t0 + peak);
  lfo.connect(depth); depth.connect(flut.gain); lfo.start(t0 + start); lfo.stop(t0 + end);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2.2;
  f.frequency.setValueAtTime(320, t0 + start); f.frequency.exponentialRampToValueAtTime(2800, t0 + peak);
  const pitches = [];
  const glide = (p, mult) => { p.setValueAtTime(N(40) * mult, t0 + start); p.exponentialRampToValueAtTime(N(59) * mult, t0 + peak); pitches.push([p, mult]); };
  [['sawtooth', 1, 0, .35], ['sawtooth', 1, 7, .3], ['sine', .5, 0, .55]].forEach(([type, mult, det, g]) => {
    const o = ctx.createOscillator(); o.type = type; o.detune.value = det; glide(o.frequency, mult);
    const og = ctx.createGain(); og.gain.value = g; o.connect(og); og.connect(f); o.start(t0 + start); o.stop(t0 + end);
  });
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6; glide(bp.frequency, 6);
  noise(t0 + start, end - start, {gain: .9, lp: 14000, hp: 120, attack: 1.2, release: 1.5, dest: bp});
  f.connect(flut); bp.connect(flut); flut.connect(out); out.connect(master);
  return {release: tc => {                                                                   // ignition: cut, then settle to idle under the hold
    out.gain.setValueAtTime(.30, tc); out.gain.linearRampToValueAtTime(.05, tc + .2); out.gain.linearRampToValueAtTime(.10, tc + .52);
    lfo.frequency.setValueAtTime(60, tc); lfo.frequency.exponentialRampToValueAtTime(22, tc + .52);
    f.frequency.setValueAtTime(2800, tc); f.frequency.exponentialRampToValueAtTime(700, tc + .52);
    pitches.forEach(([p, mult]) => { p.setValueAtTime(N(59) * mult, tc); p.exponentialRampToValueAtTime(N(40) * mult, tc + .52); });
  }};
}
// idle engine for the LOAD vamp: the drone at rest, flutter chopping, filter opening a notch per download checkpoint
function idleEngine(t0) {
  const out = ctx.createGain(); out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(.10, t0 + 1.2);
  const flut = ctx.createGain(); flut.gain.value = .55; const lfo = ctx.createOscillator(); lfo.frequency.value = 6.5;
  const depth = ctx.createGain(); depth.gain.value = .45; lfo.connect(depth); depth.connect(flut.gain); lfo.start(t0);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2.2; f.frequency.value = 300;
  const oscs = [['sawtooth', 1, 0, .35], ['sawtooth', 1, 7, .3], ['sine', .5, 0, .55]].map(([type, mult, det, g]) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = N(40) * mult; o.detune.value = det; const og = ctx.createGain(); og.gain.value = g; o.connect(og); og.connect(f); o.start(t0); return o; });
  f.connect(flut); flut.connect(out); out.connect(master);
  return {layer: (n, t) => { f.frequency.linearRampToValueAtTime([300, 460, 680, 1000][n], t + .8); out.gain.linearRampToValueAtTime(.10 + .025 * n, t + .8); },
          release: t => { out.gain.setValueAtTime(out.gain.value, t); out.gain.linearRampToValueAtTime(0, t + .35); [...oscs, lfo].forEach(o => o.stop(t + .5)); }};
}

// LAUNCH: Shepard glissando -- six octave-spaced triangle voices, each sweeping one octave, gain windowed so the rise never arrives
function shepard(t0, start, end, vel = .06) {
  const V = 6, base = N(28), w = x => .5 - .5 * Math.cos(2 * Math.PI * x / V);
  for (let i = 0; i < V; i++) {
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(base * Math.pow(2, i), t0 + start); o.frequency.exponentialRampToValueAtTime(base * Math.pow(2, i + 1), t0 + end);
    const g = ctx.createGain(); g.gain.setValueAtTime(vel * w(i) + .0001, t0 + start); g.gain.linearRampToValueAtTime(vel * w(i + 1) + .0001, t0 + end); g.gain.linearRampToValueAtTime(0, t0 + end + .06);
    o.connect(g); g.connect(master); o.start(t0 + start); o.stop(t0 + end + .1);
  }
}
// accelerating sequencer: 16ths that tighten from 160ms to 45ms, arpeggiating B7 and climbing an octave with the Shepard
function sequencer(t0, start, end, voice) {
  let t = start, dt = .16, i = 0;
  while (t < end) { const p = (t - start) / (end - start); voice(t0 + t, 47 + [0, 7, 4, 10][i % 4] + Math.round(p * 12), .04 + .02 * p, i); t += dt; dt = Math.max(.045, dt * .93); i++; }
}
// a rumble bed whose level is set by hand: the LAUNCH engine
function rumble(t0) { const r = noise(t0, T.end, {gain: 1, lp: 400, hp: 30, attack: .01, release: 1.6, color: 'brown'}); r.g.gain.cancelScheduledValues(t0); r.g.gain.setValueAtTime(0, t0); return r.g.gain; }
// the ignition blast: white noise swept from open to closed, plus the bass drop
function blast(t0, vel = .5) {
  const n = noise(t0, 1.3, {gain: vel, lp: 9000, hp: 60, attack: .01, release: .9});
  n.f1.frequency.setValueAtTime(9000, t0); n.f1.frequency.exponentialRampToValueAtTime(150, t0 + 1.1);
  sub(t0, 130, 34, 1.0, .7);
}

/* ============================ SCORES ============================ */
// Each score is five hooks on two clocks plus two vamps:
//   vampLoad(bar, i, layer)  one BAR of the tape-loader vamp; layer 0-3 = download quartile reached
//   pre(t0)                  the fixed sign-on up to the tension hold (power, draw, connections; engines spool)
//   status(t, i)             a live ping when boot milestone i is confirmed
//   vampHold(bar, i)         one BAR of the dominant pedal: connected, waiting for the server
//   post(tU)                 the unlock and everything after, as offsets from tU; also releases held voices
// HARMONY: everything before the unlock lives on the DOMINANT (B7 and its extensions) so the E major hit
// lands as a resolution. The hold vamp IS the dominant pedal, so it can last as long as the boot does.
const DRAW6 = [59, 63, 66, 69, 73, 75];      // B D# F# A C# D# -- B13, one per sixth of the wireframe draw
const STATUS4 = [78, 81, 85, 87];             // F#5 A5 C#6 D#6 -- 5, b7, 9, 3 of B9; D# leads to the E above
const STATUS_CH = [[78, 75, 69], [81, 78, 75], [85, 81, 78], [87, 81, 78]];   // SID chord cycles under each status note
const CIRC = 87;                              // D#6: the leading tone, held hanging until the unlock
const CONNECT_NOTES = [78, 81, 85, 87, 90, 93];   // B9 upper structure climbing: the strum of connect pings stays on the dominant
// the source phrase was G# B C# D# . E (the last five here); longer titles start lower on the same E-major walk
const STRAGGLER_NOTES = [64, 66, 68, 71, 73, 75, 76, 78, 80, 83, 85, 87, 88].slice(-(TALK.N + 1));     // G# B C# D# . E -- the flourishes are a phrase that walks up to the tonic
let MODE = 'connect';
const HOLD_ARP = [71, 75, 78, 81, 83, 81, 78, 75];   // B7 arpeggio for the pedal, top octave, up and back

// shared pre/post skeletons; each score supplies the voices
function preSkeleton(t0, s) {
  s.power(t0);
  T.boot.forEach((b, i) => s.boot(t0 + b, i));
  DRAW6.forEach((m, i) => s.draw(t0 + T.draw + i * (T.drawDur / 6), m, i));
  s.circ(t0 + T.circ);
  if (MODE === 'connect') [...NET.lines].sort((a, b) => a.connectAt - b.connectAt).forEach((l, i) => s.connect(t0 + l.connectAt, CONNECT_NOTES[i % CONNECT_NOTES.length] + (i % 5 === 0 ? 12 : 0), i, false));
  else s.key(t0);
}
function postSkeleton(tU, s) {
  s.unlock(tU);
  s.beam(tU);
  for (let i = 0; i < T.P.tagN; i++) s.tag(tU + T.P.tag + i * (T.P.tagDur / T.P.tagN), i);
  if (MODE === 'connect') {
    T.P.stragglers.forEach((off, i) => s.connect(tU + off, STRAGGLER_NOTES[i], i, true, i === T.P.stragglers.length - 1));
    noise(tU, T.end - 4, {gain: .028, lp: 9000, hp: 2500, attack: .4, release: 1.2, color: 'pink'});           // data hiss under the streams
  }
  s.flicker(tU + T.P.flicker);
}

function scoreFM() {
  let hum = null, bootPad = null;
  const s = {
    power: t => { sub(t, 40, 220, .5, .2); noise(t, .5, {gain: .06, lp: 6000, hp: 400, attack: .02, release: .4, color: 'pink'}); },
    boot: t => { for (let i = 0; i < 8; i++) click(t + i * .024, .05, 4000, 1800); },
    draw: (t, m, i) => bell(t, m, .15 + i * .01, .9, 2.0),
    circ: t => bell(t, CIRC, .16, 1.2, 3.5),
    key: t => keyTurn(t, .12),
    connect: (t, m, i, late, last) => { bell(t, m, late ? .11 : .04, late ? 1.4 : .8, 3.5); if (last) bell(t, 64, .09, 2.0, 2.0); },
    unlock: t => { sub(t, 90, 38, .6, .5); [40, 52, 59, 64, 68, 71, 76].forEach((m, i) => fmBrass(t, m, 2.6, i < 2 ? .22 : .13)); bell(t, 88, .2, 2.6, 3.5); bell(t + .03, 95, .12, 2.4, 2.0); pad(t + .2, 40, T.end - 6, .10, {attack: 1.2, release: 1.4}); },
    beam: t => beamSweep(t, .06),
    tag: t => bell(t, 103, .035, .25, 5),
    flicker: t => noise(t, .1, {gain: .06, lp: 2500, hp: 600, attack: .002, release: .08, color: 'pink'}),
  };
  return {
    vampLoad: (bar, i, layer) => {
      if (!hum) hum = padHold(bar, 35, .15, 1.0);
      if (i % 4 === 0) bell(bar, 59, .13, 1.6, 2.0);
      if (layer >= 1) bell(bar, i % 2 ? 66 : 59, .11, .9, 2.0);
      if (layer >= 2) bell(bar + BAR / 2, 71, .10, .7, 3.5);
      if (layer >= 3 && i % 2) bell(bar + BAR / 4, 87, .09, 1.0, 3.5);
    },
    pre: t0 => { if (hum) hum.release(t0); bootPad = padHold(t0 + .45, 35, .09, .6); preSkeleton(t0, s); },
    status: (t, i) => bell(t, STATUS4[i], .13, .7, 3.5),
    vampHold: (bar, i) => { fmBrass(bar, 47, .18, .20, {index: 2.2}); if (i % 2) bell(bar, CIRC, .17, .8, 3.5); if (i % 4 === 2) bell(bar + BAR / 2, 81, .10, .6, 2.0); },
    post: tU => { if (bootPad) bootPad.release(tU); postSkeleton(tU, s); },
  };
}

function scoreSID() {
  let pedal = null;
  const s = {
    power: t => { for (let i = 0; i < 12; i++) chip(t + i * .035, 36 + i * 3, .035, .1, .5); chipNoise(t + .1, .3, .12); },
    boot: t => { for (let i = 0; i < 6; i++) chip(t + i * .03, 96, .012, .05, .125); },
    draw: (t, m) => sid(t, m, .16, .18, 8),
    circ: t => ringBell(t, CIRC, .18, 1.0, 1.41),
    // key turn: ratchet clicks, then a ii-V bass walk (F#2 on the turn, B2 as the key seats, held until the unlock resolves it to E)
    key: t => { for (let i = 0; i < 5; i++) chipNoise(t + T.turn + i * .024, .012, .12); sid(t + T.turn, 42, T.click - T.turn, .2, 6); pedal = sidHold(t + T.click, 47, .22, 6); chipNoise(t + T.click, .05, .15); },
    connect: (t, m, i, late, last) => { chip(t, m, late ? .12 : .05, late ? .14 : .06, .125); if (!late && i === 0) pedal = sidHold(t, 47, .18, 6); if (last) chip(t, [64, 68, 71], .6, .12, .5, 50); },
    unlock: t => { chipNoise(t, .35, .3); sid(t, 40, 2.4, .22, 4); chip(t, [64, 68, 71, 76], 2.4, .2, .5, 50); ringBell(t, 88, .2, 2.0); sid(t + .6, 52, 1.8, .10, 2); },
    beam: t => { const n = chipNoise(t + T.P.scan, T.P.scanDur, .08); n.f2.frequency.setValueAtTime(400, t + T.P.scan); n.f2.frequency.exponentialRampToValueAtTime(8000, t + T.P.scan + T.P.scanDur); },
    tag: t => chip(t, 100, .015, .06, .125),
    flicker: t => chipNoise(t, .06, .15),
  };
  return {
    vampLoad: (bar, i, layer) => {
      chip(bar, 35, .10, .22, .5);
      if (layer >= 1) [47, 54, 51, 57].forEach((m, k) => chip(bar + k * BAR / 4, m, .06, .14, .25));
      if (layer >= 2) [59, 66, 63, 69].forEach((m, k) => chip(bar + k * BAR / 4 + BAR / 8, m, .04, .10, .125));
      if (layer >= 3 && i % 2) ringBell(bar, 75, .16, .8, 1.41);
    },
    pre: t0 => preSkeleton(t0, s),
    status: (t, i) => chip(t, STATUS_CH[i], .14, .16, .5, 50),
    vampHold: (bar, i) => { chip(bar, HOLD_ARP, BAR, .14, .5, 16); if (i % 2) ringBell(bar, CIRC, .18, .7, 1.41); },
    post: tU => { if (pedal) pedal.release(tU); postSkeleton(tU, s); },
  };
}

function scoreTurbine() {
  let idle = null, eng = null; const held = [];
  const CHORD = [35, 47, 51, 57];              // B1 B2 D#3 A3 -- B7, one swell per boot milestone, held until ignition resolves it to E
  const s = {
    power: t => noise(t, .6, {gain: .08, lp: 1200, hp: 60, attack: .05, release: .5, color: 'brown'}),
    boot: () => {},
    draw: (t, m, i) => swell(t, m, .55, .07 + i * .01, .12),
    circ: t => bell(t, CIRC, .12, 1.4, 2.0),
    key: t => keyTurn(t, .16),
    connect: (t, m, i, late, last) => { bell(t, m, late ? .10 : .035, late ? 1.8 : 1.2, 2.0); if (last) swell(t, 64, 1.8, .07, .08); },
    unlock: t => {
      noise(t - .28, .3, {gain: .1, lp: 11000, hp: 2500, attack: .25, release: .05});           // cymbal swell into the hit
      sub(t, 70, 30, .9, .8); timpani(t, 40, .7);
      [40, 52, 59, 64, 68, 71, 76, 83].forEach((m, i) => brass(t, m, 2.8, i < 2 ? .26 : .15));
      [64, 71, 76].forEach(m => strings(t + .05, m + 12, 3.0, .07, {attack: .3}));
      bell(t, 88, .18, 3.0, 2.0); bell(t + .4, 95, .1, 2.8, 3.5);
    },
    beam: t => beamSweep(t, .08),
    tag: t => bell(t, 100, .03, .3, 5),
    flicker: () => {},
  };
  return {
    vampLoad: (bar, i, layer) => { if (!idle) idle = idleEngine(bar); idle.layer(layer, bar); if (layer >= 2 && i % 4 === 0) bell(bar, 59 + (layer >= 3 ? 12 : 0), .05, 1.8, 2.0); },
    pre: t0 => { if (idle) idle.release(t0); eng = turbine(t0); preSkeleton(t0, s); },
    status: (t, i) => held.push(swellHold(t - .1, CHORD[i], .12, .5)),
    vampHold: (bar, i) => { if (i % 2) bell(bar, CIRC, .07, 1.2, 2.0); if (i % 4 === 0) swell(bar, 69, BAR * 2, .05, .3); },
    post: tU => { eng.release(tU - .02); held.forEach(h => h.release(tU)); postSkeleton(tU, s); },
  };
}

function scoreLaunch() {
  let loadRumble = null, rumbleGain = null;
  const tick = (t, m, d, i) => chip(t, m, d, i % 4 === 0 ? .12 : .08, .25);
  const s = {
    power: t => sub(t, 30, 60, .8, .3),
    boot: (t, i) => { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 880; const g = ctx.createGain(); g.gain.setValueAtTime(.12, t); g.gain.setValueAtTime(.12, t + .1); g.gain.linearRampToValueAtTime(0, t + .13); o.connect(g); g.connect(master); o.start(t); o.stop(t + .15); timpani(t, 40 - i, .3); },
    draw: () => {}, circ: () => {},
    key: t => keyTurn(t, .16),
    connect: (t, m, i, late, last) => { bell(t, m, late ? .10 : .035, late ? 1.4 : .7, 3.5); if (late) pluck(t, m - 12, .05, .3); if (last) { bell(t, 64, .08, 2.2, 2.0); pluck(t, 52, .07, .8); } },
    unlock: t => {
      blast(t, .5); timpani(t, 40, .8);
      brass(t, 64, .26, .4); brass(t + .26, 71, .26, .42);                                     // the motif: a rising fifth, then the octave lands with the beam
      [40, 52, 59, 64, 68, 71, 76].forEach((m, i) => brass(t + .52, m, 2.6, i < 2 ? .26 : .14));

if (q.get('run')) {
  ui.classList.add('hidden');
  if (q.get('sound') && q.get('sound') !== 'mute') document.getElementById('sound').checked = true;
  try { startAll(); console.log('started', MODE, sound ? document.querySelector('input[name=score]:checked').value : 'silent'); } catch (e) { console.error('START ERROR', e); }
}
// Repeat visit (or a reduced-motion preference): no start screen, no intro -- boot and show the prompt. The silent
// path needs no user gesture. REPLAY INTRO (?intro=1) is still there for anyone who wants the show.

  ui.classList.add('hidden'); document.getElementById('sound').checked = false; fast = true; markSeen();
  try { startAll(); } catch (e) { console.error('START ERROR', e); }
}
if (q.get('t') !== null) {
  const seek = parseFloat(q.get('t')), uAt = parseFloat(q.get('unlock_at') || T.holdMin);
  MODE = q.get('mode') || MODE; netStop(); ui.classList.add('hidden'); stage.classList.toggle('connect', MODE === 'connect');
  if (q.get('load') !== null) { loader.phase = 'download'; loader.progress = parseFloat(q.get('load')); loader.bytes = loader.progress * loader.total; loader.lastBytesAt = performance.now(); vamp.innerHTML = vampText(); vamp.classList.add('on'); renderLoader(loader.bytes, seek); }
  else {
    stage.classList.add('play'); UNLOCK.at = uAt;
    if (q.get('vamp') === 'boot') { loader.phase = 'boot'; loader.lines = BOOT_LINES.slice(0, 12); vamp.innerHTML = vampText(); vamp.classList.add('on', 'hold'); }
    document.querySelectorAll('#boot .st').forEach((el, i) => { if (seek >= T.boot[i] + T.status && (q.get('vamp') !== 'boot' || i < 2)) el.classList.add('on'); });
    if (q.get('hand') === '1') { HAND.at = uAt + T.P.hand; document.body.classList.add('hand', 'termon'); fitColumn(); tprint('<span class="d">1:M * Server initialized</span>'); tprint('<span class="d">1:M * Ready to accept connections tcp</span>'); tprint('&nbsp;'); }
    requestAnimationFrame(() => {
      preAnims().forEach(a => { a.pause(); a.currentTime = seek * 1000; });
      if (seek >= uAt) { stage.classList.add('unlock'); requestAnimationFrame(() => postAnims().forEach(a => { a.pause(); a.currentTime = (seek - uAt) * 1000; })); }
      netLastT = seek; renderNet(seek);

}

/* ============================ DECK: clicker-driven talk ============================ */
const DECK = {step: 'idle', qi: 0, slides: [], idx: -1, litAt: null, t0: null};
const TALK_MIN = 15;                           // 20-minute slot, 5 kept for questions
const QUARTILES = [0.25, 0.5, 0.75, 1.0];
const deckScore = q.get('score') || 'fm';
function deckLoader() {                      // replaces startLoader/startRealLoader: progress moves on the clicker
  Object.assign(loader, {phase: 'download', lines: [], ready: false, marks: [false, false, false, false], lastBytesAt: performance.now()});
  deckQuartile(0);
}
function deckQuartile(i) {
  DECK.qi = i; loader.progress = QUARTILES[i]; loader.bytes = loader.progress * loader.total; loader.lastBytesAt = performance.now();
}
function deckBoot() {                        // the click at 100%: boot, every marker already there -> status pops on the beat, unlock at holdMin
  DECK.t0 = performance.now(); DECK.step = 'signon'; loader.phase = 'boot'; loader.lines = BOOT_LINES.slice(0, 12); loader.marks = [true, true, true, true]; loader.ready = true;
  // the sign-on starts on the next bar; lit (title + name done) is TALK.end after the unlock
  const watch = () => { if (phase === 'post') { DECK.litAt = signonStart + UNLOCK.at + TALK.end; DECK.step = 'post'; } else setTimeout(watch, 50); };
  watch();
}
function bridgeSound(t0) {                   // build_bridge.py's thump + whine + hiss + landing click, as a buffer
  const SR = ctx.sampleRate, dur = 1.03, n = Math.ceil(SR * dur), buf = ctx.createBuffer(2, n, SR);
  let seed = 7; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const gauss = () => { const u = rnd() || 1e-9, v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const L = buf.getChannelData(0), R = buf.getChannelData(1); let wph = 0; const tc = 10 / 30;
  for (let i = 0; i < n; i++) {
    const t = i / SR;
    const thump = .55 * Math.sin(2 * Math.PI * (70 * t - 25 * t * t)) * Math.exp(-t / .09);
    wph += 2 * Math.PI * (15700 + (9000 - 15700) * (i / n)) / SR;
    const whine = .05 * Math.sin(wph) * Math.exp(-t / .12);
    const hiss = .06 * gauss() * Math.exp(-t / .05);
    const click = t >= tc ? .25 * gauss() * Math.exp(-(t - tc) / .004) : 0;
    const fade = Math.min(1, Math.max(0, (dur - t) / .15));
    L[i] = R[i] = Math.max(-1, Math.min(1, (thump + whine + hiss + click) * fade));
  }
  const src = ctx.createBufferSource(), g = ctx.createGain(); src.buffer = buf; g.gain.value = .9;
  src.connect(g); g.connect(ctx.destination); src.start(t0);
}
function deckBridge() {
  DECK.step = 'bridge'; phase = 'done'; netRunning = false; vampShow(false);
  if (ctx) { const t = ctx.currentTime; try { master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + .25); } catch (e) {} bridgeSound(t + .01); }
  stage.classList.add('off');
  const line = document.getElementById('bline'), white = document.getElementById('bwhite');
  setTimeout(() => { stage.style.visibility = 'hidden'; line.style.opacity = 1; line.style.height = '4px'; }, 230);
  setTimeout(() => { line.style.height = '7px'; }, 263);
  setTimeout(() => { line.style.height = '5px'; }, 297);
  setTimeout(() => { line.style.opacity = 0; white.classList.add('open'); }, 330);
  // Land on the white bridge, then enter the body ONLY once every slide has
  // decoded (DECK.ready). On file:// / a warm cache this resolves before the
  // 700ms bridge animation finishes, so entry is unchanged; on a cold Pages
  // load it holds on the white screen (seamless -- slide backgrounds are white
  // too) rather than advancing into a half-fetched slide. A tiny counter shows
  // only if the hold is actually visible.
  setTimeout(() => {
    const hold = setTimeout(() => {
      const n = DECK.slides ? DECK.slides.length : 0;
      const el = document.getElementById('preload');
      if (el) { el.textContent = `loading ${DECK.decoded || 0}/${n}`; el.classList.add('show'); }
    }, 120);
    Promise.resolve(DECK.ready).then(() => {
      clearTimeout(hold);
      const el = document.getElementById('preload'); if (el) el.classList.remove('show');
      document.body.classList.add('deck'); DECK.step = 'body'; deckShow(0);
    });
  }, 700);
}
function deckShow(i) {
  const imgs = document.querySelectorAll('#deck img'); if (!imgs.length) { DECK.idx = -1; return; }
  DECK.idx = Math.max(0, Math.min(imgs.length - 1, i));
  imgs.forEach((im, k) => im.classList.toggle('cur', k === DECK.idx));
}
async function deckLoadSlides() {                   // slides-lite/slides.js (file://) or slides-lite/slides.json (served)
  try {
    if (window.SLIDES) DECK.slides = window.SLIDES;
    else { const r = await fetch('slides-lite/slides.json'); if (!r.ok) return; DECK.slides = await r.json(); }
    const d = document.getElementById('deck');
    DECK.decoded = 0;
    // Decode every slide upfront and track completion. deckBridge() waits on
    // DECK.ready before showing slide 0, so from a server (Pages) a slow fetch
    // can never land mid-talk; from file:// decode is instant and this is a
    // no-op. img.decode() rejects on a genuinely broken image -- count it as
    // settled so a single bad slide can't wedge the whole deck.
    DECK.ready = Promise.all(DECK.slides.map(s => {
      const im = document.createElement('img'); im.src = s; im.decoding = 'sync'; d.appendChild(im);
      return im.decode().catch(() => {}).then(() => { DECK.decoded++; });

function deckNext() {
  switch (DECK.step) {
    case 'idle':
      DECK.step = 'load'; ui.classList.add('hidden');
      document.getElementById('sound').checked = true; document.getElementById('tape').checked = false;
      document.querySelector(`input[name=score][value=${deckScore}]`).checked = true;
      document.querySelector('input[name=mode][value=connect]').checked = true;
      startAll(); break;
    case 'load': if (DECK.qi < 3) deckQuartile(DECK.qi + 1); else deckBoot(); break;
    case 'signon': break;                                          // the sign-on is not interruptible
    case 'post': if (nowS() >= DECK.litAt) deckBridge(); break;    // ... until the name has landed

    case 'body': deckShow(DECK.idx + 1); break;

}
function deckPrev() {
  if (DECK.step === 'load' && DECK.qi > 0) deckQuartile(DECK.qi - 1);
  else if (DECK.step === 'body') deckShow(DECK.idx - 1);
}
function clockShow(on) {                     // hold T: elapsed since the sign-on, slide n/N, nothing the room needs to see for long
  const c = document.getElementById('clock'); c.classList.toggle('show', on); if (!on) return;
  const tick = () => {
    if (!c.classList.contains('show')) return;
    const s = DECK.t0 ? Math.floor((performance.now() - DECK.t0) / 1000) : 0, m = Math.floor(s / 60);
    const n = document.querySelectorAll('#deck img').length;
    c.textContent = `${m}:${String(s % 60).padStart(2, '0')}  ·  ${DECK.step === 'body' ? DECK.idx + 1 : 0}/${n}`;
    c.classList.toggle('late', s >= TALK_MIN * 60); c.classList.toggle('amber', s >= (TALK_MIN - 2) * 60 && s < TALK_MIN * 60);

document.addEventListener('keyup', e => { if (e.key === 't' || e.key === 'T') clockShow(false); }, true);
const NEXT = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'n', 'N'], PREV = ['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p', 'P'];
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (NEXT.includes(e.key)) { e.preventDefault(); deckNext(); }
  else if (PREV.includes(e.key)) { e.preventDefault(); deckPrev(); }
  else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
  else if (e.key === 'b' || e.key === 'B') document.body.classList.toggle('black');
  else if (e.key === 't' || e.key === 'T') { e.preventDefault(); clockShow(true); }
  else if (e.key === 'Escape') e.preventDefault();                 // never the try-valkey skip
}, true);
document.addEventListener('click', e => { deckNext(); }, true);
window.__deck = DECK; window.__deckNext = deckNext;
deckLoadSlides();
